name: Release Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-candidate.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "fixtures/**"
      - "career-mcp/**"
      - "career-store/**"
      - "resume-agent/**"
      - "resume-cli/**"
      - "resume-core/**"
      - "resume-plugin/**"
      - "resume-render/**"
      - "workflow/**"

permissions:
  contents: read

jobs:
  e2e-release-candidate:
    name: E2E release-candidate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run main gate
        run: python3 tools/run_gate.py --main --root .
      - name: Build package artifacts
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
      - name: Smoke test built wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/resume-kit-rc"
          "$RUNNER_TEMP/resume-kit-rc/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/resume-kit-rc/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/resume-kit-rc/bin/python" tools/run_smoke.py \
            --root . \
            --workspace "$RUNNER_TEMP/resume-kit-rc-smoke" \
            --installed-env
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-dist
          path: dist/*
          if-no-files-found: error
